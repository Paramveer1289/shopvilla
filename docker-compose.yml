version: '3.8'

services:
  # MongoDB Database Service
  mongo:
    image: mongo:7-jammy
    container_name: shopvilla-mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - shopvilla_mongo_data:/data/db
    networks:
      - shopvilla-network

  # Node.js Express REST API Backend
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: shopvilla-server
    restart: always
    depends_on:
      - mongo
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/shopvilla
      - CLIENT_URL=http://localhost:3000
      - JWT_SECRET=shopvilla_super_production_secret_jwt_key_2026
      - JWT_EXPIRES_IN=7d
      - JWT_COOKIE_EXPIRES_IN=7
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_FROM=ShopVilla Support <no-reply@shopvilla.com>
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-rzp_test_secret}
    networks:
      - shopvilla-network

  # React Vite Frontend SPA
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: shopvilla-client
    restart: always
    depends_on:
      - server
    ports:
      - '3000:80'
    networks:
      - shopvilla-network

volumes:
  shopvilla_mongo_data:
    driver: local

networks:
  shopvilla-network:
    driver: bridge
